services:
  # Servicio de Producción (Nginx Alpine optimizado)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-flashcards-prod
    ports:
      - "8080:80"
    restart: unless-stopped

  # Servicio de Desarrollo con Hot-Reload (Opcional: docker compose run --service-ports dev)
  dev:
    image: node:20-alpine
    container_name: study-flashcards-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
